apiVersion: apps/v1
kind: Deployment
metadata:
  name: elrr-cass
spec:
  template:
    spec:
      containers:
      - name: elrr-cass
        image: registry1.dso.mil/ironbank/opensource/cassproject/cass:1.5.27
        env:
        - name: ELASTICSEARCH_ENDPOINT
          value: http://elrr-elasticsearch:9200
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
        resources:
          limits:
            memory: 1Gi
