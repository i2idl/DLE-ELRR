# Runs elrr-services with Postgres - Provided for demonstration purposes only!
# To run: docker compose up
# See the Docker Compose docs for more info: https://docs.docker.com/compose/
configs:
  schema:
    file: ./elrrserviceentities/dev-resources/schema.sql

services:
  postgres:
    restart: always
    image: "registry1.dso.mil/ironbank/opensource/postgres/postgresql:13.6"
    configs:
      - source: schema
        target: /docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DC_PG_DB:?err}
      POSTGRES_USER: ${DC_PG_USER:?err}
      POSTGRES_PASSWORD: ${DC_PG_PASSWORD:?err}

  zookeeper:
    image: 'bitnami/zookeeper:latest'
    ports:
      - '2181:2181'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka1:
    image: 'bitnami/kafka:latest'
    user: root
    ports:
      - '9092:9092'
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_storage1:/bitnami/kafka
    depends_on:
      - zookeeper

  elrr:
    build: .
    restart: always
    ports:
      - "8092:8092"
    depends_on:
      - postgres
      - kafka1
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PG_DATABASE: ${DC_PG_DB:?err}
      PG_RW_USER: ${DC_PG_USER:?err}
      PG_RW_PASSWORD: ${DC_PG_PASSWORD:?err}
      KAFKA_HOST: kafka1
      KAFKA_PORT: 9092


volumes:
  db-data:
  kafka_storage1:
